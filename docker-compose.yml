name: tastigo

# Bases de données ----------------------------------------------------------------
# - MongoDB : base du service Restaurant. Lancé en replica set à un nœud pour
#   autoriser les transactions multi-documents (agrégat + outbox).
# - Redis   : bases des services Commande (DB 2), Livraison (DB 3) et Suivi (DB 4).
# - bus     : instance Redis dédiée aux échanges d'événements (Redis Streams).
services:
  mongodb:
    image: mongo:8.0
    container_name: tastigo-mongodb
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongodb:/workspace:ro
      - ./niveau1:/niveau1:ro
    healthcheck:
      # Initialise le replica set au premier passage, puis attend que le nœud soit primaire.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}) } quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    container_name: tastigo-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis:/workspace:ro
      - ./niveau1:/niveau1:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  bus:
    image: redis:7.4-alpine
    container_name: tastigo-bus
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - bus_data:/data
      - ./redis:/workspace:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Services -------------------------------------------------------------------------
  restaurant:
    build: ./services
    container_name: tastigo-restaurant
    command: ["uvicorn", "restaurant.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      MONGO_URL: mongodb://mongodb:27017/?replicaSet=rs0
      MONGO_DB: tastigo_restaurant
      BUS_URL: redis://bus:6379/0
      SEED: "true"
    ports:
      - "8001:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      bus:
        condition: service_healthy

  commande:
    build: ./services
    container_name: tastigo-commande
    command: ["uvicorn", "commande.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      REDIS_URL: redis://redis:6379/2
      BUS_URL: redis://bus:6379/0
    ports:
      - "8002:8000"
    depends_on:
      redis:
        condition: service_healthy
      bus:
        condition: service_healthy

  livraison:
    build: ./services
    container_name: tastigo-livraison
    command: ["uvicorn", "livraison.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      REDIS_URL: redis://redis:6379/3
      BUS_URL: redis://bus:6379/0
    ports:
      - "8003:8000"
    depends_on:
      redis:
        condition: service_healthy
      bus:
        condition: service_healthy

  suivi:
    build: ./services
    container_name: tastigo-suivi
    command: ["uvicorn", "suivi.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      REDIS_URL: redis://redis:6379/4
      BUS_URL: redis://bus:6379/0
    ports:
      - "8004:8000"
    depends_on:
      redis:
        condition: service_healthy
      bus:
        condition: service_healthy

  # Interface de démonstration ----------------------------------------------------------
  interface:
    image: nginx:1.27-alpine
    container_name: tastigo-interface
    ports:
      - "8000:80"
    volumes:
      - ./interface/public:/usr/share/nginx/html:ro
      - ./interface/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      restaurant:
        condition: service_healthy
      commande:
        condition: service_healthy
      livraison:
        condition: service_healthy
      suivi:
        condition: service_healthy

volumes:
  mongodb_data:
  redis_data:
  bus_data:

# Sert l'interface de démonstration et relaie /api/<service>/ vers l'API du service.
# La page n'a ainsi qu'une seule origine (pas de CORS) et n'accède à aucune base.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/restaurant/ { proxy_pass http://restaurant:8000/; }
    location /api/commande/   { proxy_pass http://commande:8000/; }
    location /api/livraison/  { proxy_pass http://livraison:8000/; }
    location /api/suivi/      { proxy_pass http://suivi:8000/; }
}
